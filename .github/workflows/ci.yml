name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}"

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pinpoint
          POSTGRES_PASSWORD: pinpoint
          POSTGRES_DB: pinpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinpoint -d pinpoint"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: cd backend && uv sync --frozen

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://pinpoint:pinpoint@localhost:5432/pinpoint' || '' }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm test

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend
        run: cd frontend && npm run build

  stack:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build stack
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait

      - name: Run integration tests
        run: make integration

      - name: Run end-to-end tests
        run: make e2e

      - name: Capture compose logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-failure-artifacts
          path: |
            compose-logs.txt
            e2e/playwright-report/

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  agents-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .agents/ and .claude/ are in sync
        run: bash scripts/check-agents-sync.sh

  deploy:
    needs: [stack]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        run: curl --fail-with-body -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for /health to report this commit
        run: |
          sha="${{ github.sha }}"
          for i in $(seq 1 60); do
            body="$(curl -fsS "${{ vars.PUBLIC_URL }}/health" || true)"
            deployed="$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$deployed" = "$sha" ]; then
              echo "Deployed commit $deployed matches $sha."
              exit 0
            fi
            echo "Attempt $i/60: deployed commit is '${deployed:-<none>}', waiting for $sha..."
            sleep 10
          done
          echo "Timed out after 10 minutes waiting for $sha to appear at ${{ vars.PUBLIC_URL }}/health"
          exit 1
