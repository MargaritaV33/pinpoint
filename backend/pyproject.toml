[project]
name = "pinpoint-backend"
version = "0.1.0"
description = "Pinpoint backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "bcrypt<4.1",
    "fastapi>=0.115",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

