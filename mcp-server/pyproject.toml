[project]
name = "pinpoint-mcp"
version = "0.1.0"
description = "Read-only MCP server for a running Pinpoint instance (stdio)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.12,<2",
]

[project.scripts]
pinpoint-mcp = "pinpoint_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinpoint_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
