# Render Blueprint — see docs/deployment.md for the dashboard flow this
# file drives and issue #12 for the full rationale.
#
# No VITE_API_BASE_URL (or any other frontend env var) appears below. That
# is deliberate: the Dockerfile (issue #8) already bakes
# VITE_API_BASE_URL="" into the frontend bundle at build time, so the
# served frontend makes same-origin requests and needs no runtime
# configuration on Render at all.
#
# No dockerCommand here, deliberately: this web service runs the
# Dockerfile's own CMD unmodified, exactly as docker-compose.yaml already
# does. An earlier version of this file overrode the command with a
# dockerCommand string that rewrote DATABASE_URL's scheme inline via
# `sh -c "... uv run uvicorn ..."`. That override failed in production
# with `sh: 1: ... uv run uvicorn ...: not found` (exit 127) — the whole
# multi-word dockerCommand string was being treated as a single, not-found
# executable rather than a parsed shell script. (Confirmed separately: the
# Dockerfile's runtime stage does install `uv`, and its own CMD — the exec
# form below, with no dockerCommand override — was verified in a real
# `docker build` + `docker run` against a live Postgres; see issue #12's
# reopening comment.) Overriding the command at all was the fragile part;
# not overriding it removes that whole class of failure. The postgres:// /
# postgresql:// -> postgresql+psycopg:// dialect normalisation now lives
# in backend/app/config.py's Settings instead, so every consumer of
# settings.database_url gets the correct driver with no command-line
# rewriting needed.
services:
  - type: web
    name: pinpoint
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Render's own push-triggered deploys are off (default would be
    # `commit` — auto-deploy on every push). ci.yml's `deploy` job, gated
    # on a green `stack` run on `main`, is the only deploy trigger now
    # (issue #13).
    autoDeployTrigger: off
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pinpoint-db
          property: connectionString

databases:
  - name: pinpoint-db
    plan: free
    databaseName: pinpoint
    user: pinpoint
